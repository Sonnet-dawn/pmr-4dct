name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Only the data-free checks run here: the DIR-Lab and CREATIS volumes are
      # not redistributable, so any check that needs them would fail on CI.
      # The full suite (including the data-dependent checks) is run locally; see
      # docs/verification.md.
      - name: Verification suite (data-free subset)
        run: python run_verification_suite.py --only exact_basis,projection_exact,tre_convention
